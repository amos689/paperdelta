name: PaperDelta checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    name: Local studio / browser
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - run: python -m pip install '.[dev,mcp,wandb]'
      - name: Test real experiment adapter protocols
        run: python -X utf8 tools/run_tests.py -q tests/test_experiment_exports.py
      - run: npm install --prefix build/browser-tools --no-audit --no-fund playwright@1.62.1
      - run: node build/browser-tools/node_modules/playwright/cli.js install --with-deps chromium
      - name: Test bilingual native binding workflows
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/build/browser-tools/node_modules/playwright
        run: node tools/validate_studio_browser.cjs build/studio-browser
      - name: Test bilingual ongoing review and restart recovery
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/build/browser-tools/node_modules/playwright
        run: node tools/validate_review_browser.cjs build/studio-review-browser
      - name: Test joined bilingual revisions, reviewed writes and exact recovery
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/build/browser-tools/node_modules/playwright
        run: node tools/validate_revisions_browser.cjs build/revisions-browser
      - name: Measure complete candidate search and large-project interaction
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/build/browser-tools/node_modules/playwright
        run: node tools/validate_studio_scale.cjs build/studio-scale
      - name: Test bilingual batch binding, templates and CLI/MCP proposal imports
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/build/browser-tools/node_modules/playwright
        run: node tools/validate_batch_browser.cjs build/studio-batch-browser
      - name: Test bilingual TSV, Excel and offline experiment evidence
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/build/browser-tools/node_modules/playwright
        run: node tools/validate_evidence_browser.cjs build/studio-evidence-browser
      - name: Measure bilingual three-stage onboarding on identical inputs
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/build/browser-tools/node_modules/playwright
        run: node tools/validate_onboarding_browser.cjs build/onboarding-browser
      - name: Test reviewed experiment definitions and identity labels
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/build/browser-tools/node_modules/playwright
        run: node tools/validate_onboarding_browser.cjs build/experiment-browser --definitions
      - name: Test direct reuse of reviewed experiment definitions
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/build/browser-tools/node_modules/playwright
        run: node tools/validate_onboarding_browser.cjs build/reuse-browser --reuse
      - name: Replay recorded mapping model actions against frozen implementations
        run: python -X utf8 tools/replay_mapping_v4.py --out build/mapping-replay
      - name: Test bilingual statistical contracts and compound displays
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/build/browser-tools/node_modules/playwright
        run: node tools/validate_statistics_browser.cjs build/studio-statistics-browser
      - name: Test bilingual notes, merged tables and original PDF coordinates
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/build/browser-tools/node_modules/playwright
        run: node tools/validate_layout_browser.cjs build/studio-layout-browser
      - name: Replay frozen licensed native documents
        run: python -X utf8 tools/replay_native.py --out build/native-replay
      - name: Replay frozen twenty-document native study
        run: python -X utf8 tools/replay_native_v2.py --out build/native-v2-replay
      - name: Test reviewed native identities and private diagnostic exports
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/build/browser-tools/node_modules/playwright
        run: node tools/validate_reliability_browser.cjs build/reliability-browser
      - name: Test bilingual static source and exported PDF reports
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/build/browser-tools/node_modules/playwright
        run: node tools/validate_static_reports.cjs build/static-reports
      - name: Test selected bilingual review archives and offline replay
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/build/browser-tools/node_modules/playwright
        run: node tools/validate_review_bundle_browser.cjs build/review-bundle-browser
      - name: Install controlled Notebook execution dependencies
        # Only the authored validation below requests execution; checking stays read-only.
        run: python -m pip install nbclient==0.10.2 nbformat==5.10.4 ipykernel==6.30.1
      - name: Install Quarto for the authored render workflow
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2
        with:
          version: '1.9.38'
      - name: Verify actual Notebook execution and Quarto PDF freshness
        run: python -X utf8 tools/validate_notebook_workflow.py --out build/notebook-workflow --quarto quarto
      - name: Test bilingual workflow declarations, fragments and revision lists
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/build/browser-tools/node_modules/playwright
        run: node tools/validate_workflows_browser.cjs build/workflows-browser
      - name: Keep all browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: studio-browser
          path: |
            build/studio-browser/evidence.json
            build/studio-browser/*.png
            build/studio-review-browser/evidence.json
            build/studio-review-browser/*.png
            build/studio-review-browser/*-errors.json
            build/revisions-browser/evidence.json
            build/revisions-browser/*.png
            build/revisions-browser/*-failure.json
            build/studio-scale/evidence.json
            build/studio-scale/*.png
            build/studio-scale/*-errors.json
            build/studio-batch-browser/evidence.json
            build/studio-batch-browser/*.png
            build/studio-evidence-browser/evidence.json
            build/studio-evidence-browser/*.png
            build/studio-evidence-browser/failure.json
            build/onboarding-browser/evidence.json
            build/onboarding-browser/*.png
            build/onboarding-browser/*-actions.json
            build/onboarding-browser/failure.json
            build/experiment-browser/evidence.json
            build/reuse-browser/evidence.json
            build/reuse-browser/*.png
            build/reuse-browser/*-actions.json
            build/reuse-browser/failure.json
            build/experiment-browser/*.png
            build/experiment-browser/failure.json
            build/mapping-replay/*.json
            build/studio-statistics-browser/evidence.json
            build/studio-statistics-browser/*.png
            build/studio-statistics-browser/failure.json
            build/studio-layout-browser/evidence.json
            build/studio-layout-browser/*.png
            build/native-replay/evidence.json
            build/native-v2-replay/evidence.json
            build/reliability-browser/evidence.json
            build/reliability-browser/*.png
            build/reliability-browser/failure.json
            build/static-reports/evidence.json
            build/static-reports/*.png
            build/review-bundle-browser/evidence.json
            build/review-bundle-browser/*.png
            build/review-bundle-browser/failure.json
            build/workflows-browser/evidence.json
            build/workflows-browser/*.png
            build/workflows-browser/failure.json
            build/notebook-workflow/evidence.json
            build/notebook-workflow/paper/reports/**
            build/notebook-workflow/paper/.paperdelta/run-logs/**
          if-no-files-found: warn

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[dev,mcp,wandb]'
      - run: python -m ruff check src tests tools
      - run: python -m ruff format --check src tests tools
      - run: python -X utf8 tools/check_docs.py
      - run: python -X utf8 tools/run_tests.py -q --junitxml=build/test-results.xml
      - run: python -X utf8 tools/validate_examples.py --out build/examples-validation
      - run: python -X utf8 tools/build_release.py --out build/release-candidate
      - run: python -X utf8 tools/audit_release.py --directory build/release-candidate
      - name: Verify isolated uvx startup and optional native dependencies
        if: matrix.python == '3.12'
        run: |
          python -m pip install uv==0.12.22
          python -X utf8 tools/validate_uvx.py --out build/uvx-validation
      - name: Check PyPI description before tagging a release
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: |
          python -m pip install twine
          python -m twine check --strict build/release-candidate/*.whl build/release-candidate/*.tar.gz
      - name: Prepare a fresh paper checkout for the composite action
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        id: action-fixture
        run: python -X utf8 tools/validate_action.py prepare --out build/action-integration
      - uses: ./
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        id: action-check
        continue-on-error: true
        with:
          project: ${{ steps.action-fixture.outputs.project }}
          base-commit: ${{ steps.action-fixture.outputs.base }}
          report: build/action-en
      - name: Verify the actual action result, preserved inputs and code isolation
        if: always() && matrix.os == 'ubuntu-latest' && matrix.python == '3.12' && steps.action-fixture.outcome == 'success'
        env:
          CHECK_EXIT: ${{ steps.action-check.outputs.exit-code }}
        run: python -X utf8 tools/validate_action.py verify --out build/action-integration --exit-code "$CHECK_EXIT"
      - name: Keep test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tests-${{ matrix.os }}-${{ matrix.python }}
          path: |
            build/test-results.xml
            build/uvx-validation/evidence.json
            build/uvx-validation/*.log
            build/action-integration/fixture.json
            build/action-integration/verification-*.json
            build/action-integration/paper/build/action-en/*
          if-no-files-found: warn

  macos:
    name: macOS ${{ matrix.host.arch }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        host:
          - {os: macos-15, arch: arm64}
          - {os: macos-15-intel, arch: x86_64}
        python: ['3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.host.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build
      - run: python -X utf8 tools/build_release.py --out build/release-candidate
      - run: python -X utf8 tools/audit_release.py --directory build/release-candidate
      - name: Validate native installed wheel, filesystem and terminal
        run: >-
          python -X utf8 tools/validate_platform.py
          --wheel build/release-candidate/*.whl
          --out build/macos-validation
          --require-system Darwin
          --expected-arch ${{ matrix.host.arch }}
      - name: Verify native macOS isolated uvx startup
        if: matrix.python == '3.12'
        run: |
          python -m pip install uv==0.12.22
          python -X utf8 tools/validate_uvx.py --out build/uvx-validation
      - name: Keep macOS evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-${{ matrix.host.arch }}-python-${{ matrix.python }}
          path: |
            build/macos-validation/evidence.json
            build/macos-validation/core-smoke.json
            build/macos-validation/*.log
            build/macos-validation/suite/**/*.json
            build/macos-validation/suite/**/*.log
            build/macos-validation/suite/**/*.xml
            build/macos-validation/examples/evidence.json
            build/macos-validation/ci-demo/evidence.json
            build/release-candidate/package-audit.json
            build/uvx-validation/evidence.json
            build/uvx-validation/*.log
          if-no-files-found: warn
