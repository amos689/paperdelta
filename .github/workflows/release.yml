name: Publish stable release to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable release tag (for example v0.3.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pypi-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'amos689/paperdelta' && (github.event_name == 'workflow_dispatch' || !github.event.release.prerelease)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    env:
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Verify tag, successful CI and exact GitHub release assets
        run: python -X utf8 tools/verify_release.py --tag "$RELEASE_TAG" --out build/public-release
      - run: python -X utf8 tools/audit_release.py --directory build/public-release
      - name: Check package metadata and isolated core installation
        run: |
          python -m pip install twine
          python -m twine check --strict build/public-release/*.whl build/public-release/*.tar.gz
          python -m venv build/core-install
          build/core-install/bin/python -m pip install build/public-release/*.whl
          build/core-install/bin/python -I tools/package_smoke.py --out build/public-release/core-smoke.json
      - name: Select only verified Python distributions
        run: |
          mkdir dist
          cp build/public-release/*.whl build/public-release/*.tar.gz dist/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pypi-distributions
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: publication-verification
          path: |
            build/public-release/publication-verification.json
            build/public-release/package-audit.json
            build/public-release/core-smoke.json

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/paperdelta/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pypi-distributions
          path: dist/
      - name: Publish the verified release with short-lived credentials
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true
