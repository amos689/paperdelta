[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "paperdelta"
version = "2.0.0"
description = "Review how experiment changes affect an existing research paper."
readme = "docs/package-description.rst"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "amos689"}]
maintainers = [{name = "amos689", email = "101008326+amos689@users.noreply.github.com"}]
keywords = ["latex", "docx", "pdf", "markdown", "quarto", "research", "reproducibility", "agents", "scientific-writing"]
dependencies = [
  "pydantic>=2.10,<3",
  "PyYAML>=6.0.2,<7",
  "pylatexenc>=2.11,<3",
  "mpmath>=1.4.1,<1.5",
  "markdown-it-py>=4.2,<4.3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12", "build>=1.2", "python-docx>=1.2,<2", "pdfplumber>=0.11.10,<0.12", "reportlab>=4.4,<5", "pypdf>=6.19,<6.20"]
docx = ["python-docx>=1.2,<2"]
pdf = ["pdfplumber>=0.11.10,<0.12", "pypdf>=6.19,<6.20"]
spike = ["TexSoup==0.3.3"]
mcp = ["mcp>=2.2,<3"]
wandb = ["wandb>=0.30.0,<0.31"]
demo = ["matplotlib>=3.9,<4"]

[project.scripts]
paperdelta = "paperdelta.cli:main"

[project.urls]
Source = "https://github.com/amos689/paperdelta"
Documentation = "https://github.com/amos689/paperdelta/blob/main/README.md"
Issues = "https://github.com/amos689/paperdelta/issues"
Releases = "https://github.com/amos689/paperdelta/releases"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
paperdelta = [
  "locales/*.json", "assets/*.css", "assets/*.js",
  "demo_word/*.docx", "demo_word/*.yaml", "demo_word/results/*.csv",
  "demo_pdf/*.pdf", "demo_pdf/*.tex", "demo_pdf/*.yaml", "demo_pdf/results/*.csv",
  "demo_markdown/*.md", "demo_markdown/*.yaml", "demo_markdown/results/*.csv",
  "demo_quarto/*.qmd", "demo_quarto/*.yaml", "demo_quarto/results/*.csv",
  "demo_project/*.yaml", "demo_project/paper/*.tex", "demo_project/results/*.csv",
  "demo_project/paper/figures/*.pdf", "demo_project/paper/figures/*.json",
  "demo_project/scripts/*.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["tests/corpus/history"] # Immutable implementation snapshots.

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/paperdelta/reports.py" = ["E501"] # Embedded offline HTML/CSS/JS literals.
"src/paperdelta/html_report.py" = ["E501"] # Escaped HTML fragments.
"src/paperdelta/studio_ui.py" = ["E501"] # Static workbench HTML.

