schema_version: 8
paper:
  entry: paper.qmd
  macros: {}
  companions:
  - entry: appendix.md
    macros: {}
  - entry: export.pdf
    macros: {}
    export_of: paper.qmd
rounding: half_up
sources:
  results:
    path: results/metrics.csv
    format: csv
    primary_key:
    - model
    - seed
    columns:
      model: string
      seed: integer
      accuracy: decimal
metrics:
  accuracy:
    source: results
    field: accuracy
    where:
      model: Ours
    reduce: mean
    expected_seeds:
    - 1
    - 2
    - 3
    seed_column: seed
    expected_count: 3
    unit: fraction
  baseline:
    source: results
    field: accuracy
    where:
      model: Baseline
    reduce: unique
    seed_column: seed
    expected_count: 1
    unit: fraction
occurrences:
  abstract_accuracy:
    file: paper.qmd
    anchor:
      prefix: Our method achieves **
      suffix: '** accuracy on Data-A.'
      block: sha256:22656833f8818022896a19a0632f2214439ab7ea2fbcb83a39fd27f17acd87f0
    metric: accuracy
    display:
      kind: percent
      places: 1
      percent_symbol: true
  table_accuracy:
    file: paper.qmd
    anchor:
      table:
        headers:
        - Method & Accuracy (%)
        row_prefix:
        - Ours
        column: 1
        percent_symbol: false
    metric: accuracy
    display:
      kind: percent
      places: 1
      percent_symbol: false
  table_baseline:
    file: paper.qmd
    anchor:
      table:
        headers:
        - Method & Accuracy (%)
        row_prefix:
        - Baseline
        column: 1
        percent_symbol: false
    metric: baseline
    display:
      kind: percent
      places: 1
      percent_symbol: false
  supplement_accuracy:
    file: appendix.md
    anchor:
      prefix: 'The shared accuracy is '
      suffix: .
      block: sha256:3a3ac8cedea1d41e659731ba5b3f6583514d58dca01d727fb7a14e07c5bc779c
    metric: accuracy
    display:
      kind: percent
      places: 1
      percent_symbol: true
  export_table_accuracy:
    file: export.pdf
    anchor:
      table:
        headers:
        - Method & Accuracy
        row_prefix:
        - Ours
        column: 1
        percent_symbol: false
        page: 1
        parser: paperdelta-pdf/2;pdfplumber/0.11.10;pdfminer/20260107
    metric: accuracy
    display:
      kind: percent
      places: 1
      percent_symbol: false
  export_table_baseline:
    file: export.pdf
    anchor:
      table:
        headers:
        - Method & Accuracy
        row_prefix:
        - Baseline
        column: 1
        percent_symbol: false
        page: 1
        parser: paperdelta-pdf/2;pdfplumber/0.11.10;pdfminer/20260107
    metric: baseline
    display:
      kind: percent
      places: 1
      percent_symbol: false
  export_abstract_accuracy:
    file: export.pdf
    anchor:
      prefix: 'Our method achieves '
      suffix: ' accuracy on Data-A.'
      block: sha256:7775a30d20bc3e196f474de6f678fc56e6e7d70d8788154a0bd5165ade703ef6
      parser: paperdelta-pdf/2;pdfplumber/0.11.10;pdfminer/20260107
    metric: accuracy
    display:
      kind: percent
      places: 1
      percent_symbol: true
claims:
  main_comparison:
    file: paper.qmd
    anchor:
      exact: Our method outperforms Baseline on Data-A.
    predicate:
      op: greater_than
      left: accuracy
      right: baseline
      candidates: []
      allow_ties: false
    scope: {}
figures: {}
require_complete_coverage: false
coverage_exclusions: {}
