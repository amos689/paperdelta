# Copy to the paper repository's .github/workflows/paper-review.yml.
# Configure PAPERDELTA_REVISION as the reviewed full commit SHA of a 1.5+ release.
name: Paper review
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  experiment-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          path: paper
          fetch-depth: 0
          persist-credentials: false
      - name: Validate the trusted checker revision
        shell: bash
        env:
          CHECKER_REVISION: ${{ vars.PAPERDELTA_REVISION }}
        run: '[[ "$CHECKER_REVISION" =~ ^[a-fA-F0-9]{40}$ ]]'
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: amos689/paperdelta
          ref: ${{ vars.PAPERDELTA_REVISION }}
          path: .trusted-paperdelta
          persist-credentials: false
      - uses: ./.trusted-paperdelta
        id: review
        continue-on-error: true
        with:
          project: paper
          base-commit: ${{ github.event.pull_request.base.sha || github.sha }}
          snapshot: submitted-v1
          lang: en
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        id: reports
        with:
          name: paperdelta-review
          path: paper/build/paperdelta/
          if-no-files-found: warn
      - name: Link the downloadable review
        if: always() && steps.reports.outputs.artifact-url != ''
        shell: bash
        env:
          ARTIFACT_URL: ${{ steps.reports.outputs.artifact-url }}
        run: |
          printf '\n[Download PaperDelta reports / 下载审查报告](%s)\n' "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
          printf '\nOpen report.html after extracting. Word/PDF locations are shown there.\n解压后打开 report.html 查看 Word/PDF 原生位置。\n' >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve the experiment check result
        if: always()
        shell: bash
        env:
          CHECK_EXIT: ${{ steps.review.outputs.exit-code }}
        run: |
          case "$CHECK_EXIT" in 0|1|2) exit "$CHECK_EXIT" ;; *) exit 2 ;; esac

  reference-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          path: paper
          persist-credentials: false
      - uses: amos689/paper-preflight@d44231c87e27221e057eeb0ca44d3977574b351e # v0.4.0
        id: references
        continue-on-error: true
        with:
          path: paper
          lang: en
          # Registry lookups belong to this separate, optional job.
          # Set true for cache-only checking; missing evidence remains incomplete.
          offline: 'false'
          sarif: paper-preflight.sarif
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: paper-preflight-review
          path: paper-preflight.sarif
          if-no-files-found: warn
      - name: Preserve the reference check result
        if: always()
        shell: bash
        env:
          CHECK_EXIT: ${{ steps.references.outputs.exit-code }}
        run: |
          case "$CHECK_EXIT" in 0|1|2|3) exit "$CHECK_EXIT" ;; *) exit 3 ;; esac
